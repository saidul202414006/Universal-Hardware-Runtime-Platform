[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-hardware-runtime"
version = "2.0.0"
description = "Universal Hardware Runtime Platform — Control any hardware board through a single unified API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Universal Hardware Runtime Contributors" }]
requires-python = ">=3.11"
keywords = ["hardware", "iot", "esp32", "arduino", "mcp", "runtime", "firmware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

dependencies = [
    # Web framework
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",

    # MCP — mcp 2.0.0 has opentelemetry conflicts on Python 3.14, use 1.29.0
    "mcp>=1.29.0,<2.0.0",
    "fastmcp>=3.4.0",

    # Data validation & serialization
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",

    # Database
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.0",
    "aiosqlite>=0.22.0",

    # Logging
    "structlog>=26.1.0",

    # Hardware communication
    "pyserial>=3.5",
    "pyusb>=1.3.0",
    "esptool>=5.3.0",

    # CLI
    "typer>=0.27.0",
    "rich>=15.0.0",

    # Utilities
    "watchdog>=6.0.0",
    "slowapi>=0.1.10",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "types-pyyaml",
    "types-pyserial",
]
postgres = [
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
]
all = [
    "universal-hardware-runtime[dev,postgres]",
]

[project.scripts]
uhr = "packages.core.cli:app"
uhr-server = "packages.core.api:start"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

# =============================================================================
# Ruff — Linting & Formatting
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "adapters", "plugins", "runtimes", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",  # do not perform function calls in default arguments
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["packages", "adapters", "plugins", "runtimes"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# =============================================================================
# Mypy — Static Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "apps/"]

[[tool.mypy.overrides]]
module = ["esptool.*", "serial.*", "usb.*"]
ignore_missing_imports = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Unit tests (no hardware required)",
    "integration: Integration tests (no hardware required)",
    "hardware: Tests requiring physical hardware",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["packages"]
omit = ["tests/*", "scripts/*", "apps/*"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
